<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndustroTech Pvt Ltd</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f4f6f9;
color:#333;
}

/* HEADER */
header{
background:#111;
color:white;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
width:100%;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:700;
color:#ff3b3b;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
color:white;
text-decoration:none;
font-size:14px;
}

nav ul li a:hover{
color:#ff3b3b;
}

/* HAMBURGER */
.menu-toggle{
display:none;
font-size:26px;
cursor:pointer;
}

/* HERO */
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1581090700227-1e37b190418e') no-repeat center/cover;
display:flex;
align-items:center;
padding:0 8%;
color:white;
position:relative;
margin-top:70px;
}

.hero::after{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
max-width:600px;
}

.hero h1{
font-size:42px;
margin-bottom:20px;
}

.hero p{
margin-bottom:25px;
}

.btn{
background:#ff3b3b;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:5px;
display:inline-block;
}

section{
padding:80px 8%;
}

.section-title{
text-align:center;
margin-bottom:50px;
font-size:28px;
font-weight:600;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-align:center;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:6px;
margin-bottom:15px;
}

.about{
display:flex;
flex-wrap:wrap;
gap:40px;
align-items:center;
}

.about img{
width:100%;
max-width:500px;
border-radius:8px;
}

.about-text{
flex:1;
}

.why{
background:#111;
color:white;
}

.why-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
text-align:center;
}

.news{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.news img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
}

.contact{
background:#f9f9f9;
}

form{
display:grid;
gap:15px;
max-width:600px;
margin:auto;
}

input,textarea{
padding:12px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#ff3b3b;
color:white;
border:none;
padding:12px;
cursor:pointer;
}

footer{
background:#111;
color:white;
text-align:center;
padding:30px 10%;
}

/* MOBILE STYLING */
@media(max-width:768px){

nav ul{
position:absolute;
top:70px;
left:0;
width:100%;
background:#111;
flex-direction:column;
display:none;
}

nav ul li{
margin:15px 0;
text-align:center;
}

.menu-toggle{
display:block;
}

.hero{
text-align:center;
padding:0 5%;
}

.hero h1{
font-size:28px;
}

.about{
flex-direction:column;
text-align:center;
}

}
</style>
</head>
<body>

<header>
<div class="logo">IndustroTech</div>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<nav>
<ul id="menu">
<li><a href="#">Home</a></li>
<li><a href="#about">About</a></li>
<li><a href="#products">Products</a></li>
<li><a href="#news">News</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<h1>Leading Manufacturer of Industrial Components</h1>
<p>We specialize in high-quality electronic and mechanical components for global industries.</p>
<a href="#contact" class="btn">Get In Touch</a>
</div>
</section>

<!-- Rest of your sections remain SAME (products, about, why, news, contact, footer) -->

<script>
function toggleMenu(){
var menu = document.getElementById("menu");
if(menu.style.display === "flex"){
menu.style.display = "none";
}else{
menu.style.display = "flex";
}
}
</script>

</body>
</html>
